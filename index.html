        .copy-btn:hover { background: #e55c00; }
        .copy-btn.success { background: #4CAF50; }

    // 初始載入顯示全部
    window.onload = () => renderResults(knowledgeBase);

    function search() {
        const query = document.getElementById('query').value.trim().toLowerCase();
        
        if (!query) {
            renderResults(knowledgeBase);
            return;
        }

        const matches = knowledgeBase.filter(item => 
            item.question.toLowerCase().includes(query) || 
            item.category.toLowerCase().includes(query) ||
            item.reply.toLowerCase().includes(query)
        );
        
        renderResults(matches, query);
    }

    function renderResults(data, query = "") {
        const resultsDiv = document.getElementById('results');
        const countDiv = document.getElementById('result-count');
        
        if (data.length === 0) {
            countDiv.innerText = "找不到相關的建議回覆，請嘗試其他關鍵字。";
            resultsDiv.innerHTML = "";
            return;
        }

        countDiv.innerText = query ? `找到 ${data.length} 筆相關結果` : `共 ${data.length} 筆常用罐頭回覆`;
        
        resultsDiv.innerHTML = data.map((item, index) => `
            <div class="card">
                <div class="card-header" onclick="toggleCard(${index})">
                    <span class="tag">${item.category}</span>
                    <span class="question-text">${highlight(item.question, query)}</span>
                    <span style="color:#999; font-size: 12px;">▼ 點擊展開</span>
                </div>
                <div class="card-body" id="body-${index}">
                    <div class="reply-text" id="reply-${index}">${highlight(item.reply, query)}</div>
                    <button class="copy-btn" onclick="copyText(${index}, this)">📋 複製回覆</button>
                </div>
            </div>
        `).join('');
        
        // 如果有搜尋且結果小於 5 筆，自動展開
        if (query && data.length <= 5) {
            data.forEach((_, index) => toggleCard(index, true));
        }
    }

    function highlight(text, query) {
        if (!query) return text;
        const regex = new RegExp(query, 'gi');
        return text.replace(regex, match => `<span style="background-color: yellow;">${match}</span>`);
    }

    function toggleCard(index, forceShow = false) {
        const body = document.getElementById(`body-${index}`);
        if (forceShow) {
            body.classList.add('show');
        } else {
            body.classList.toggle('show');
        }
    }

    function copyText(index, btnElement) {
        // 取得未經 highlight 標記的純文字
        const itemBody = document.getElementById(`reply-${index}`);
        const textToCopy = itemBody.innerText; // 使用 innerText 獲取純文字
        
        navigator.clipboard.writeText(textToCopy).then(() => {
            const originalText = btnElement.innerHTML;
            btnElement.innerHTML = "✅ 已複製！";
            btnElement.classList.add("success");
            setTimeout(() => {
                btnElement.innerHTML = originalText;
                btnElement.classList.remove("success");
            }, 2000);
        }).catch(err => {
            console.error('複製失敗:', err);
            alert('複製失敗，請手動圈選複製');
        });
    }
</script>
</body>
</html>
